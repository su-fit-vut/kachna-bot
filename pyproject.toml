[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kis-food-announcer"
version = "0.1.0"
description = "Kachna Discord bot for sound playback and food order notifications."
readme = "README.md"
license = { text = "Beerware" }
authors = [
    { name = "Lukas Matuska", email = "matuska.lukas@lukasmatuska.cz" },
]
requires-python = ">=3.10"
keywords = ["kis", "food", "announcer", "signalr", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Czech",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "License :: Freely Distributable",
]
dependencies = [
    "disnake",
    "requests",
    "spotipy",
    "pynacl",
    "signalrcore",
]

[project.urls]
Homepage = "https://github.com/su-fit-vut/kis-food-announcer"
Repository = "https://github.com/su-fit-vut/kis-food-announcer.git"

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "pre-commit",
    "pytest",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["kis_food_announcer*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.isort]
known-first-party = [
    "announcer",
    "client",
    "config",
    "doorbell",
    "helper",
    "kachnaonline",
    "main",
    "music",
    "oauth",
    "sound",
    "toasts",
]
